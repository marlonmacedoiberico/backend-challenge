# Añade aquí tu servicio `api` (puerto 3000, CLOCK_MODE=test, PROVIDER_URL=http://provider:4010)
# y su base de datos. El servicio `provider` no se modifica.
services:
  api:
    build: .
    environment:
      PORT: "3000"
      CLOCK_MODE: test
      PROVIDER_URL: http://provider:4010
      DATABASE_URL: postgresql://clinicsay:clinicsay@db:5432/clinicsay
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicsay
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay
    ports:
      - "5433:5432"
    volumes:
      - clinicsay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicsay -d clinicsay"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider:
    build: ./provider
    ports:
      - "4010:4010"

volumes:
  clinicsay-postgres-data:
